name: MCP Checks
on:
  push:
    branches: [main, beta, feat/mcp-server]
  pull_request:
    branches: [main, beta]
    types: [opened, reopened, synchronize, review_requested, ready_for_review]
jobs:
  gates:
    if: github.event.pull_request.draft == false
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # coverage:check compares the evidence commit stamps against history;
          # commits and trees are enough for that, blobs are fetched on demand
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci && npm ci --prefix mcp
      # dprint resolves globs against the working directory: run from the repo root
      - name: Format
        run: npx dprint check "mcp/src/**/*.ts" "mcp/scripts/*.mjs" "mcp/*.ts" "mcp/*.json" "mcp/README.md" "mcp/docs/*.md"
      - name: Lint
        run: npx oxlint --deny-warnings mcp/src mcp/scripts
      - name: Typecheck
        run: npx tsgo --noEmit -p mcp/tsconfig.json
      - name: Coverage matrix
        run: npm --prefix mcp run coverage:check
